<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Éléa</title>
    <link rel="icon" type="image/png" href="src/favicon.png">
    <!-- Import des polices Google Fonts : Montserrat & Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <!-- Element Audio (Son de téléphone) -->
    <audio id="phoneAudio" src="src/telephone.mp3" preload="auto"></audio>

    <!-- Téléphone suspendu à gauche (Cliquable) -->
    <div class="phone-hanging-container" id="phoneContainer">
        <img src="src/telephone.png" alt="Téléphone Contact" id="phoneImg" class="phone-hanging-img">
    </div>

    <!-- Header -->
    <header class="navbar">
        <!-- Bouton Retour Accueil (Maison SVG) -->
        <a href="index.html" class="home-icon" aria-label="Accueil">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>

        <!-- Bouton menu déroulant (visible uniquement sur mobile) -->
        <button
            type="button"
            id="mobile-menu-toggle"
            class="mobile-menu-btn"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="mobile-dropdown"
        >
            <span class="burger-lines" aria-hidden="true"></span>
        </button>

        <!-- Navigation & contrôles (bureau : alignés horizontalement | mobile : menu déroulant) -->
        <div id="mobile-dropdown" class="nav-panel">
            <nav class="nav-links" aria-label="Navigation principale">
                <a href="contact.html" class="active-link" aria-current="page" data-fr="Contact" data-en="Contact">Contact</a>
                <span class="nav-dot" aria-hidden="true">•</span>
                <a href="presentation.html" data-fr="Présentation" data-en="About">Présentation</a>
            </nav>

            <!-- Contrôles : Langue & Mode Sombre -->
            <div class="nav-controls">
                <button type="button" id="lang-toggle" class="control-btn" aria-label="Changer de langue">
                    <span id="lang-fr" class="lang-option active">FR</span>
                    <span class="lang-divider" aria-hidden="true">|</span>
                    <span id="lang-en" class="lang-option">EN</span>
                </button>
                <button type="button" id="theme-toggle" class="control-btn theme-icon" aria-label="Changer de thème">⏾</button>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="contact-container">
        <!-- Titre principal -->
        <h1 class="page-title" data-fr="contact" data-en="contact">contact</h1>

        <!-- Texte de présentation en Montserrat -->
        <div class="contact-text">
            <p class="subtitle" data-fr="Une question ou envie d'échanger ?" data-en="A question or want to get in touch?">
                Une question ou envie d'échanger ?
            </p>
            <p class="description" data-fr="Si vous souhaitez en savoir plus sur mon parcours, mes projets ou discuter d’un stage ou d’une alternance, n’hésitez pas à me contacter." data-en="If you would like to know more about my background, my projects, or discuss an internship or work-study position, feel free to reach out.">
                Si vous souhaitez en savoir plus sur mon parcours, mes projets ou discuter d’un stage ou d’une alternance, n’hésitez pas à me contacter.
            </p>
        </div>

        <!-- Formulaire de mail -->
        <form class="contact-form" action="https://formspree.io/f/xnpjdywk" method="POST">
            <!-- Ligne Prénom / Nom alignée -->
            <div class="form-row">
                <div class="form-group">
                    <label for="firstname" data-fr="prénom" data-en="first name">prénom</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Votre prénom..." required>
                </div>
                <div class="form-group">
                    <label for="lastname" data-fr="nom" data-en="last name">nom</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Votre nom..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="email" data-fr="adresse mail" data-en="email address">adresse mail</label>
                <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
            </div>

            <div class="form-group">
                <label for="subject" data-fr="objet" data-en="subject">objet</label>
                <input type="text" id="subject" name="_subject" placeholder="Sujet de votre message..." required>
            </div>

            <div class="form-group">
                <label for="message" data-fr="écrivez votre texte ici" data-en="write your text here">écrivez votre texte ici</label>
                <textarea id="message" name="message" rows="4" placeholder="Bonjour Éléa..." required></textarea>
            </div>

            <button type="submit" class="btn btn-submit" data-fr="envoyer" data-en="send">envoyer</button>
        </form>
    </main>

    <script>
        // --- DOM Elements ---
        const phoneContainer = document.getElementById('phoneContainer');
        const phoneAudio = document.getElementById('phoneAudio');
        const phoneImg = document.getElementById('phoneImg');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const langToggleBtn = document.getElementById('lang-toggle');
        const langFr = document.getElementById('lang-fr');
        const langEn = document.getElementById('lang-en');

        const mobileMenuBtn = document.getElementById('mobile-menu-toggle');
        const mobileDropdown = document.getElementById('mobile-dropdown');

        // Form inputs
        const firstnameInput = document.getElementById('firstname');
        const lastnameInput = document.getElementById('lastname');
        const emailInput = document.getElementById('email');
        const subjectInput = document.getElementById('subject');
        const messageInput = document.getElementById('message');

        // --- Récupération des préférences sauvegardées ---
        function readSetting(primaryKey, legacyKey, fallback) {
            try {
                return (
                    localStorage.getItem(primaryKey) ||
                    localStorage.getItem(legacyKey) ||
                    fallback
                );
            } catch {
                return fallback;
            }
        }

        function saveSetting(primaryKey, legacyKey, value) {
            try {
                localStorage.setItem(primaryKey, value);
                localStorage.setItem(legacyKey, value);
            } catch {}
        }

        let isDarkMode = readSetting('site_theme', 'theme', 'light') === 'dark';
        let currentLang = readSetting('site_lang', 'lang', 'fr') === 'en' ? 'en' : 'fr';

        const placeholders = {
            fr: {
                firstname: "Votre prénom...",
                lastname: "Votre nom...",
                email: "votre.email@exemple.com",
                subject: "Sujet de votre message...",
                message: "Bonjour Éléa..."
            },
            en: {
                firstname: "First name...",
                lastname: "Last name...",
                email: "your.email@example.com",
                subject: "Subject of your message...",
                message: "Hello Éléa..."
            }
        };

        // --- Menu déroulant mobile ---
        function setMobileMenu(open) {
            if (!mobileMenuBtn || !mobileDropdown) return;
            mobileMenuBtn.setAttribute('aria-expanded', String(open));
            mobileMenuBtn.setAttribute(
                'aria-label',
                open
                    ? (currentLang === 'fr' ? 'Fermer le menu' : 'Close menu')
                    : (currentLang === 'fr' ? 'Ouvrir le menu' : 'Open menu')
            );
            mobileDropdown.classList.toggle('is-open', open);
        }

        if (mobileMenuBtn && mobileDropdown) {
            mobileMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isMenuOpen = mobileMenuBtn.getAttribute('aria-expanded') === 'true';
                setMobileMenu(!isMenuOpen);
            });

            mobileDropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => setMobileMenu(false));
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.navbar')) {
                    setMobileMenu(false);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') setMobileMenu(false);
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth > 900) {
                    setMobileMenu(false);
                }
            });
        }

        // --- Application initiale ---
        function applySavedSettings() {
            // Appliquer Thème
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeToggleBtn.textContent = '☀︎';
                if (phoneImg) phoneImg.src = 'src/telephone_black.png';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggleBtn.textContent = '⏾';
                if (phoneImg) phoneImg.src = 'src/telephone.png';
            }

            // Appliquer Langue
            langEn.classList.toggle('active', currentLang === 'en');
            langFr.classList.toggle('active', currentLang === 'fr');
            translatePage();
        }

        // --- Traduction de la page ---
        function translatePage() {
            document.documentElement.lang = currentLang;

            document.querySelectorAll('[data-fr]').forEach(el => {
                const translation = el.getAttribute(`data-${currentLang}`);
                if (translation) {
                    if (el.children.length === 0) {
                        el.textContent = translation;
                    } else {
                        const firstText = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
                        if (firstText) firstText.nodeValue = translation;
                    }
                }
            });

            // Update placeholders
            if (firstnameInput) firstnameInput.placeholder = placeholders[currentLang].firstname;
            if (lastnameInput) lastnameInput.placeholder = placeholders[currentLang].lastname;
            if (emailInput) emailInput.placeholder = placeholders[currentLang].email;
            if (subjectInput) subjectInput.placeholder = placeholders[currentLang].subject;
            if (messageInput) messageInput.placeholder = placeholders[currentLang].message;
        }

        // --- Audio Téléphone ---
        if (phoneAudio) phoneAudio.volume = 0.25;

        if (phoneContainer && phoneAudio) {
            phoneContainer.addEventListener('click', () => {
                phoneAudio.currentTime = 0;
                phoneAudio.play();
            });
        }

        // --- Switch Thème & Sauvegarde ---
        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            themeToggleBtn.textContent = isDarkMode ? '☀︎' : '⏾';
            saveSetting('site_theme', 'theme', isDarkMode ? 'dark' : 'light');

            if (phoneImg) {
                phoneImg.src = isDarkMode ? 'src/telephone_black.png' : 'src/telephone.png';
            }
        });

        // --- Switch Langue & Sauvegarde ---
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            saveSetting('site_lang', 'lang', currentLang);

            langEn.classList.toggle('active', currentLang === 'en');
            langFr.classList.toggle('active', currentLang === 'fr');

            translatePage();
        });

        // Initialiser au chargement
        applySavedSettings();
    </script>
</body>
</html>
