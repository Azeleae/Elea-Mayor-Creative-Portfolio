<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fr="CV - Éléa" data-en="Resume - Éléa">CV - Éléa</title>
    <link rel="icon" type="image/png" href="src/favicon.png">
    <!-- Import des polices Google Fonts : Figtree & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="starter.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="home-icon" aria-label="Accueil" data-aria-fr="Accueil" data-aria-en="Home">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>

        <!-- Bouton menu déroulant à droite (visible uniquement sur mobile) -->
        <button
            type="button"
            id="mobile-menu-toggle"
            class="mobile-menu-btn"
            aria-label="Ouvrir le menu"
            data-aria-fr="Ouvrir le menu"
            data-aria-en="Open menu"
            aria-expanded="false"
            aria-controls="mobile-dropdown"
        >
            <span class="burger-lines" aria-hidden="true"></span>
        </button>

        <!-- Navigation & contrôles (bureau : alignés horizontalement | mobile : menu déroulant à droite) -->
        <div id="mobile-dropdown" class="nav-panel">
            <nav class="nav-links" aria-label="Navigation principale">
                <a href="contact.html" data-fr="Contact" data-en="Contact">Contact</a>
                <span class="nav-dot" aria-hidden="true">•</span>
                <a href="presentation.html" data-fr="Présentation" data-en="About">Présentation</a>
            </nav>

            <div class="nav-controls">
                <button type="button" id="lang-toggle" class="control-btn" aria-label="Changer de langue" data-aria-fr="Changer de langue" data-aria-en="Switch language">
                    <span id="lang-fr" class="lang-option active">FR</span>
                    <span class="lang-divider" aria-hidden="true">|</span>
                    <span id="lang-en" class="lang-option">EN</span>
                </button>
                <button type="button" id="theme-toggle" class="control-btn theme-icon" aria-label="Changer de thème" data-aria-fr="Changer de thème" data-aria-en="Switch theme">⏾</button>
            </div>
        </div>
    </header>

    <!-- Zone Principale -->
    <main class="main-container">
        <!-- Scène 3D centrée -->
        <div class="scene">
            <div class="card-3d" id="card3d">
                <!-- Face Recto -->
                <div class="card-face card-front">
                    <img src="src/starter1.png" alt="Starter Pack - Recto" id="imgFront">
                </div>
                <!-- Face Verso -->
                <div class="card-face card-back">
                    <img src="src/starter2.png" alt="Starter Pack - Verso" id="imgBack">
                </div>
            </div>
        </div>

        <!-- Barre de Zoom Verticale positionnée à droite avec espace -->
        <div class="zoom-toolbar">
            <span class="zoom-icon" aria-hidden="true">🔍</span>
            <input type="range" id="zoomRange" min="0.6" max="1.8" step="0.05" value="1" aria-label="Zoom control" data-aria-fr="Contrôle du zoom" data-aria-en="Zoom control">
            <span id="zoomValue" class="zoom-value">100%</span>
            <button type="button" id="resetZoom" class="reset-btn" data-fr="Réinitialiser" data-en="Reset">Réinitialiser</button>
        </div>
    </main>

    <!-- Bouton Flottant CV PDF -->
    <div class="bottom-actions">
        <a href="src/cv.pdf" id="cvLink" target="_blank" rel="noopener noreferrer" class="btn btn-portfolio" data-fr="cv pdf" data-en="resume pdf">cv pdf</a>
    </div>

    <script>
        // --- 1. Interaction Rotation 3D (Souris & Tactile) ---
        const card = document.getElementById('card3d');
        const scene = document.querySelector('.scene');
        const zoomRange = document.getElementById('zoomRange');
        const zoomValue = document.getElementById('zoomValue');
        const resetZoomBtn = document.getElementById('resetZoom');
        const imgFront = document.getElementById('imgFront');
        const imgBack = document.getElementById('imgBack');
        const cvLink = document.getElementById('cvLink');

        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let rotX = 0;
        let rotY = 0;
        let currentZoom = 1;

        function updateTransform() {
            card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${currentZoom})`;
        }

        function startDrag(e) {
            isDragging = true;
            card.classList.add('is-dragging');
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            previousMouseX = clientX;
            previousMouseY = clientY;
        }

        function doDrag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const deltaX = clientX - previousMouseX;
            const deltaY = clientY - previousMouseY;

            rotY += deltaX * 0.6;
            rotX -= deltaY * 0.6;

            updateTransform();

            previousMouseX = clientX;
            previousMouseY = clientY;
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                card.classList.remove('is-dragging');
            }
        }

        scene.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);

        scene.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('touchmove', doDrag, { passive: true });
        window.addEventListener('touchend', stopDrag);

        // --- Gestion du Zoom via la Barre ---
        zoomRange.addEventListener('input', (e) => {
            currentZoom = parseFloat(e.target.value);
            zoomValue.textContent = Math.round(currentZoom * 100) + '%';
            updateTransform();
        });

        // --- Bouton Réinitialiser ---
        resetZoomBtn.addEventListener('click', () => {
            currentZoom = 1;
            rotX = 0;
            rotY = 0;
            zoomRange.value = 1;
            zoomValue.textContent = '100%';
            updateTransform();
        });

        // --- 2. Menu Déroulant Mobile (Navbar) ---
        const mobileMenuBtn = document.getElementById('mobile-menu-toggle');
        const mobileDropdown = document.getElementById('mobile-dropdown');

        function setMobileMenu(open) {
            if (!mobileMenuBtn || !mobileDropdown) return;
            mobileMenuBtn.setAttribute('aria-expanded', String(open));
            mobileDropdown.classList.toggle('is-open', open);
        }

        if (mobileMenuBtn && mobileDropdown) {
            mobileMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = mobileMenuBtn.getAttribute('aria-expanded') === 'true';
                setMobileMenu(!isOpen);
            });

            mobileDropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => setMobileMenu(false));
            });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.navbar')) {
                setMobileMenu(false);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                setMobileMenu(false);
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                setMobileMenu(false);
            }
        });

        // --- 3. Éléments DOM & Traductions ---
        const langToggleBtn = document.getElementById('lang-toggle');
        const langFr = document.getElementById('lang-fr');
        const langEn = document.getElementById('lang-en');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const translatableElements = document.querySelectorAll('[data-fr]');
        const ariaTranslatableElements = document.querySelectorAll('[data-aria-fr]');

        function adjustCardSize() {
            if (imgFront.complete && imgFront.naturalWidth > 0) {
                card.style.width = imgFront.clientWidth + 'px';
                card.style.height = imgFront.clientHeight + 'px';
            }
        }

        function updateStarterAssets(lang, isDark) {
            const isEnglish = lang === 'en';

            // Lien du CV selon la langue
            if (cvLink) {
                cvLink.href = isEnglish ? 'src/cvanglais.pdf' : 'src/cv.pdf';
            }

            // Visuels du starter selon langue + thème
            const langSuffix = isEnglish ? 'anglais' : '';
            const themeSuffix = isDark ? 'black' : '';

            if (imgFront) {
                imgFront.src = `src/starter1${langSuffix}${themeSuffix}.png`;
            }
            if (imgBack) {
                imgBack.src = `src/starter2${langSuffix}${themeSuffix}.png`;
            }
        }

        // --- 4. Langue ---
        function applyLanguage(lang) {
            langEn.classList.toggle('active', lang === 'en');
            langFr.classList.toggle('active', lang === 'fr');
            translatableElements.forEach(el => {
                const targetText = el.getAttribute(`data-${lang}`);
                if (targetText) {
                    if (el.tagName.toLowerCase() === 'title') {
                        document.title = targetText;
                    } else {
                        el.textContent = targetText;
                    }
                }
            });
            ariaTranslatableElements.forEach(el => {
                const ariaText = el.getAttribute(`data-aria-${lang}`);
                if (ariaText) el.setAttribute('aria-label', ariaText);
            });
            document.documentElement.lang = lang;
            updateStarterAssets(lang, document.body.classList.contains('dark-mode'));
        }

        // --- 5. Thème (Clair / Nuit) ---
        function applyTheme(theme) {
            const isDark = theme === 'dark';
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeToggleBtn.textContent = '☀︎';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggleBtn.textContent = '⏾';
            }
            updateStarterAssets(document.documentElement.lang || currentLang, isDark);
        }

        // --- 6. Chargement Initial ---
        let currentLang = localStorage.getItem('site_lang') || 'fr';
        let currentTheme = localStorage.getItem('site_theme') || 'light';

        document.documentElement.lang = currentLang;
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀︎';
        }
        applyLanguage(currentLang);
        applyTheme(currentTheme);

        // --- 7. Événements au Clic ---
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('site_lang', currentLang);
            applyLanguage(currentLang);
        });

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            localStorage.setItem('site_theme', currentTheme);
            applyTheme(currentTheme);
        });

        // --- 8. Ajustement automatique des dimensions selon l'image ---
        imgFront.addEventListener('load', adjustCardSize);
        if (imgFront.complete) {
            adjustCardSize();
        }
        window.addEventListener('resize', adjustCardSize);
    </script>
</body>
</html>
